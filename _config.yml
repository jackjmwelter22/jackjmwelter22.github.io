theme: minimal-mistakes-jekyll
plugins:
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate

# Site settings
title: "Where in the World is Welter?"
name: "Jack Welter"
description: "Travel stories and adventures from around the world."
url: "https://jackjmwelter22.github.io"
baseurl: ""

# Author info (shows in sidebar/bio)
author:
  name: "Jack Welter"
  avatar: "/assets/images/bio-photo.jpeg"
  bio: "Traveler. Writer. Always somewhere new."
  location: "USA"
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/jackwelter/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/jackjmwelter22"

# Navigation
navigation:
  - title: "About"
    url: /about/
  - title: "Blog"
    url: /blog/
  - title: "Portfolio"
    url: /portfolio/
  - title: "Resume"
    url: /resume/

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/
paginate: 5
paginate_path: /blog/page:num/

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
